[versions]
kotlin = "2.4.20"
detekt = "1.23.8"
dokka = "2.2.0"
gradleMavenPublish = "0.37.0"
gradleVersions = "0.64.0"
markdownlint = "0.6.0"
coroutines = "1.11.0"
junit4 = "4.13.2"
androidxAnnotation = "1.11.0"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "androidxAnnotation" }
detekt-formatting = { module = "io.gitlab.arturbosch.detekt:detekt-formatting", version.ref = "detekt" }
junit4 = { module = "junit:junit", version.ref = "junit4" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "gradleMavenPublish" }
versions = { id = "com.github.ben-manes.versions", version.ref = "gradleVersions" }
markdownlint = { id = "com.appmattus.markdown", version.ref = "markdownlint" }
